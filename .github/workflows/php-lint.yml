name: PHP lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v3
        with:
          php-version: '8.5'
      - run: find . -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
